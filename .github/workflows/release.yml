# Shack-Bench release workflow.
#
# Trigger:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Builds Windows / Linux / macOS in parallel, then publishes a GitHub
# Release with the Windows ZIP + Inno Setup installer, the Linux
# AppImage, and the macOS DMG attached.  Manual runs via the Actions
# tab are also supported (workflow_dispatch).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: every job gets a read-only token by default. Only the
# `release` job, which creates the GitHub Release, is granted write access.
# In particular the Linux job downloads and executes third-party linuxdeploy
# binaries, so it must never hold a token that can write to this repository.
permissions:
  contents: read

env:
  QT_VERSION: '6.8.0'

jobs:
  # ── Windows ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebsockets qtserialport'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # Run the registered suites before anything is packaged, so a failing
      # test stops the release. Single-config Ninja build, so no -C needed.
      # install-qt-action puts the Qt bin dir on PATH, so the test exes find
      # the Qt DLLs. instrument_probe_test needs the bench and is deliberately
      # not registered with add_test(), so ctest never runs it.
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
        env:
          # Suites are Qt Core only; offscreen guards a headless runner in
          # case one ever touches QtGui.
          QT_QPA_PLATFORM: offscreen

      - name: Stage and zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($version) -or -not $version.StartsWith("v")) {
              $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $stage = "ShackBench-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Top-level runtime files: exe + DLLs deployed by windeployqt.
          Copy-Item build\ShackBench.exe $stage\
          Get-ChildItem build\*.dll | Copy-Item -Destination $stage\
          if (Test-Path build\vc_redist.x64.exe) {
              Copy-Item build\vc_redist.x64.exe $stage\
          }

          # Plugin directories windeployqt creates.  No sqldrivers here —
          # ShackBench doesn't link Qt6::Sql.
          $pluginDirs = @('platforms','styles','imageformats',
                          'iconengines','tls','networkinformation','generic')
          foreach ($d in $pluginDirs) {
              if (Test-Path "build\$d") { Copy-Item -Recurse "build\$d" $stage\ }
          }

          Copy-Item README.md $stage\
          Copy-Item LICENSE  $stage\

          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Write-Host "Created $stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ShackBench-*-windows-x64.zip
          if-no-files-found: error

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($version) -or -not $version.StartsWith("v")) {
              $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $stage = "ShackBench-$version-windows-x64"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
              throw "ISCC.exe not found at $iscc — Inno Setup install failed"
          }

          $env:TCIMON_VERSION = $version.TrimStart("v")
          $env:TCIMON_STAGING = (Resolve-Path $stage).Path
          & $iscc /O. installer\shackbench.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }

          Get-ChildItem ShackBench-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ShackBench-Setup-*-windows-x64.exe
          if-no-files-found: error

  # ── Linux (AppImage) ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              ninja-build \
              build-essential \
              libgl1-mesa-dev \
              libxkbcommon-dev \
              libxcb-cursor0 \
              libxcb-xinerama0 \
              libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebsockets qtserialport'
          cache: true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
        env:
          # Suites are Qt Core only; offscreen guards a headless runner in
          # case one ever touches QtGui.
          QT_QPA_PLATFORM: offscreen

      - name: Stage AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/ShackBench AppDir/usr/bin/

          cat > AppDir/usr/share/applications/tcimonitor.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Shack-Bench
          GenericName=TCI Protocol Diagnostic
          Exec=ShackBench
          Icon=tcimonitor
          Comment=Diagnostic monitor for the TCI WebSocket protocol
          Categories=HamRadio;Network;
          Terminal=false
          EOF

          # Placeholder 256×256 solid-fill icon (matches AetherSDR-style
          # dark theme).  ImageMagick is preinstalled on the runner.
          convert -size 256x256 xc:'#0a1320' \
              AppDir/usr/share/icons/hicolor/256x256/apps/tcimonitor.png

      - name: Build AppImage
        run: |
          # Pinned to tagged releases rather than the rolling "continuous"
          # builds, so the packaging tool cannot change underneath a release.
          # This job runs with a read-only token (see top-level permissions).
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QMAKE="$QT_ROOT_DIR/bin/qmake"

          ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage \
              --desktop-file AppDir/usr/share/applications/tcimonitor.desktop \
              --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/tcimonitor.png

          version="${GITHUB_REF_NAME:-dev-${GITHUB_SHA:0:7}}"
          # linuxdeploy names the AppImage from the desktop file's Name= field,
          # which is "Shack-Bench". The glob here still said TCI*Monitor* — the
          # name this project had before it was renamed — so the mv found
          # nothing and the job failed after a successful build.
          #
          # Match on the extension instead of a name: there is exactly one
          # AppImage in the working directory at this point, and this cannot go
          # stale the next time the product is renamed.
          built=$(ls *.AppImage | grep -v '^linuxdeploy' | head -1)
          test -n "$built" || { echo "no AppImage produced"; ls -la; exit 1; }
          mv "$built" "ShackBench-${version}-linux-x86_64.AppImage"
          ls -lh ShackBench-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ShackBench-*-linux-x86_64.AppImage
          if-no-files-found: error

  # ── macOS (Apple Silicon) ───────────────────────────────────────────────
  build-macos:
    # macos-14, NOT macos-latest. Apple removed the AGL framework in macOS 26
    # (Tahoe), and Qt 6.8.0's FindWrapOpenGL.cmake still links it, so the job
    # failed with "framework 'AGL' not found" the moment macos-latest drifted
    # onto that SDK. Nothing in this project references AGL.
    #
    # Pinned rather than chasing a newer Qt: ShackBook builds all four
    # artifacts on macos-14 with this exact Qt version, so this is a
    # configuration proven to work rather than a guess.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtwebsockets qtserialport'
          cache: true

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
        env:
          # Suites are Qt Core only; offscreen guards a headless runner in
          # case one ever touches QtGui.
          QT_QPA_PLATFORM: offscreen

      - name: macdeployqt + DMG
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" build/ShackBench.app

          version="${GITHUB_REF_NAME:-dev-${GITHUB_SHA:0:7}}"
          dmg_name="ShackBench-${version}-macos-arm64.dmg"

          mkdir -p dmg-stage
          cp -R build/ShackBench.app dmg-stage/
          cp README.md LICENSE dmg-stage/

          hdiutil create -volname "Shack-Bench" \
              -srcfolder dmg-stage \
              -ov -format UDZO \
              "$dmg_name"
          ls -lh "$dmg_name"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ShackBench-*-macos-arm64.dmg
          if-no-files-found: error

  # ── Publish GitHub Release ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # The only job that needs to write: it creates the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \
              \( -name '*.zip' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) \
              -exec cp -v {} out/ \;
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          name: Shack-Bench ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            out/*.zip
            out/*.AppImage
            out/*.dmg
            out/*.exe
