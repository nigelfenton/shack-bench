# TCI Monitor release workflow.
#
# Trigger:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Builds Windows / Linux / macOS in parallel, then publishes a GitHub
# Release with the Windows ZIP + Inno Setup installer, the Linux
# AppImage, and the macOS DMG attached.  Manual runs via the Actions
# tab are also supported (workflow_dispatch).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

env:
  QT_VERSION: '6.8.0'

jobs:
  # ── Windows ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebsockets'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Stage and zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($version) -or -not $version.StartsWith("v")) {
              $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $stage = "TciMonitor-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Top-level runtime files: exe + DLLs deployed by windeployqt.
          Copy-Item build\TciMonitor.exe $stage\
          Get-ChildItem build\*.dll | Copy-Item -Destination $stage\
          if (Test-Path build\vc_redist.x64.exe) {
              Copy-Item build\vc_redist.x64.exe $stage\
          }

          # Plugin directories windeployqt creates.  No sqldrivers here —
          # TciMonitor doesn't link Qt6::Sql.
          $pluginDirs = @('platforms','styles','imageformats',
                          'iconengines','tls','networkinformation','generic')
          foreach ($d in $pluginDirs) {
              if (Test-Path "build\$d") { Copy-Item -Recurse "build\$d" $stage\ }
          }

          Copy-Item README.md $stage\
          Copy-Item LICENSE  $stage\

          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Write-Host "Created $stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: TciMonitor-*-windows-x64.zip
          if-no-files-found: error

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($version) -or -not $version.StartsWith("v")) {
              $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $stage = "TciMonitor-$version-windows-x64"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
              throw "ISCC.exe not found at $iscc — Inno Setup install failed"
          }

          $env:TCIMON_VERSION = $version.TrimStart("v")
          $env:TCIMON_STAGING = (Resolve-Path $stage).Path
          & $iscc /O. installer\tcimonitor.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }

          Get-ChildItem TciMonitor-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: TciMonitor-Setup-*-windows-x64.exe
          if-no-files-found: error

  # ── Linux (AppImage) ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              ninja-build \
              build-essential \
              libgl1-mesa-dev \
              libxkbcommon-dev \
              libxcb-cursor0 \
              libxcb-xinerama0 \
              libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebsockets'
          cache: true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Stage AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/TciMonitor AppDir/usr/bin/

          cat > AppDir/usr/share/applications/tcimonitor.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TCI Monitor
          GenericName=TCI Protocol Diagnostic
          Exec=TciMonitor
          Icon=tcimonitor
          Comment=Diagnostic monitor for the TCI WebSocket protocol
          Categories=HamRadio;Network;
          Terminal=false
          EOF

          # Placeholder 256×256 solid-fill icon (matches AetherSDR-style
          # dark theme).  ImageMagick is preinstalled on the runner.
          convert -size 256x256 xc:'#0a1320' \
              AppDir/usr/share/icons/hicolor/256x256/apps/tcimonitor.png

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QMAKE="$QT_ROOT_DIR/bin/qmake"

          ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage \
              --desktop-file AppDir/usr/share/applications/tcimonitor.desktop \
              --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/tcimonitor.png

          version="${GITHUB_REF_NAME:-dev-${GITHUB_SHA:0:7}}"
          mv TCI*Monitor*.AppImage "TciMonitor-${version}-linux-x86_64.AppImage"
          ls -lh TciMonitor-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: TciMonitor-*-linux-x86_64.AppImage
          if-no-files-found: error

  # ── macOS (Apple Silicon) ───────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtwebsockets'
          cache: true

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: macdeployqt + DMG
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" build/TciMonitor.app

          version="${GITHUB_REF_NAME:-dev-${GITHUB_SHA:0:7}}"
          dmg_name="TciMonitor-${version}-macos-arm64.dmg"

          mkdir -p dmg-stage
          cp -R build/TciMonitor.app dmg-stage/
          cp README.md LICENSE dmg-stage/

          hdiutil create -volname "TCI Monitor" \
              -srcfolder dmg-stage \
              -ov -format UDZO \
              "$dmg_name"
          ls -lh "$dmg_name"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TciMonitor-*-macos-arm64.dmg
          if-no-files-found: error

  # ── Publish GitHub Release ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \
              \( -name '*.zip' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) \
              -exec cp -v {} out/ \;
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          name: TCI Monitor ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            out/*.zip
            out/*.AppImage
            out/*.dmg
            out/*.exe
